<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics AI by Kanra</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00aaff">
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;font-family:system-ui;background:#000;color:#fff}
.wrap{max-width:600px;margin:0 auto;padding:20px}
textarea{width:100%;height:120px;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:14px;font-size:16px}
button{width:100%;padding:14px;background:#00aaff;color:#000;font-weight:bold;border:none;border-radius:12px;margin-top:12px;font-size:16px}
pre{white-space:pre-wrap;background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:16px;margin-top:16px}
.nav{display:flex;gap:10px;margin-top:12px}
.nav a{flex:1;text-align:center;padding:12px;background:#111;border:1px solid #333;border-radius:12px;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div style="text-align:center">
<img src="icon-192.png" style="width:80px;border-radius:20px">
<h1 style="margin:10px 0 0">Physics AI</h1>
<p style="color:#00aaff;letter-spacing:4px;font-size:12px">BY KANRA • MADE IN GHANA 🇬🇭</p>
</div>
<textarea id="q" placeholder="Paste your WASSCE Physics question..."></textarea>
<button onclick="solve()">Solve with AI ⚡</button>
<div class="nav">
<a href="#" onclick="document.getElementById('game').style.display='block';return false;">🎮 Game</a>
<a href="https://www.pwabuilder.com" target="_blank">📥 Get APK</a>
</div>
<pre id="ans" style="display:none"></pre>
<div id="game" style="display:none;margin-top:20px">
<h3>Projectile Shooter</h3>
<canvas id="c" width="500" height="300" style="width:100%;background:#050505;border:1px solid #222;border-radius:12px"></canvas>
<p>Angle: <input type="range" id="ang" min="10" max="80" value="45" oninput="draw()"> <span id="angV">45</span>° | Vel: <input type="range" id="vel" min="5" max="40" value="20" oninput="draw()"> <span id="velV">20</span> m/s</p>
<button onclick="shoot()">FIRE 🚀</button>
<p id="msg">Max range at 45°</p>
</div>
<p style="text-align:center;color:#555;font-size:12px;margin-top:30px">Physics AI by Kanra © 2026</p>
</div>
<script src="chat.js"></script>
</body>
</html>
